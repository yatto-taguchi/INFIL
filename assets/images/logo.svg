<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68">
  <defs>
    <style>
      .infill-text {
        font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: 0.18em;
        fill: #0f172a;
      }
      .infill-sub {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        letter-spacing: 0.28em;
        font-size: 8px;
        fill: #64748b;
      }
    </style>
  </defs>
  <!-- Subtle Infill Geometric Mark -->
  <g transform="translate(6, 12)">
    <polygon points="20,4 36,13 36,31 20,40 4,31 4,13" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="20" y1="4" x2="20" y2="40" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="4" y1="13" x2="36" y2="31" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="4" y1="31" x2="36" y2="13" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="2.5" fill="#0ea5e9"/>
  </g>
  <!-- Brand Text -->
  <text x="56" y="38" class="infill-text" font-size="28">INFILL</text>
  <text x="58" y="52" class="infill-sub">FILL THE GAP, BUILD THE CORE</text>
</svg>
